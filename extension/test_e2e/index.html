<!DOCTYPE html>
<html>
<head>
  <title>Twitter Mock</title>
  <style>
    body { background: #000; color: #e7e9ea; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .tweet { border-bottom: 1px solid #2f3336; padding: 12px 16px; max-width: 600px; margin: 0 auto; }
    .user-name { font-weight: bold; color: #e7e9ea; }
    .handle { color: #71767b; margin-left: 4px; }
    .tweet-text { margin-top: 4px; font-size: 15px; line-height: 20px; }
    a { text-decoration: none; color: inherit; }
  </style>
</head>
<body>
  <div style="height: 50px;"></div>
  
  <!-- Human Tweet -->
  <article data-testid="tweet" class="tweet">
    <div data-testid="User-Name">
      <a href="/human_user" role="link"><span class="user-name">Human</span> <span class="handle">@human_user</span></a>
    </div>
    <div data-testid="tweetText" class="tweet-text">Just had a great coffee! #life</div>
    <a href="/status/123" style="display:none">time</a>
  </article>

  <!-- Bot Tweet -->
  <article data-testid="tweet" class="tweet" id="bot-tweet">
    <div data-testid="User-Name">
      <a href="/ai_bot" role="link"><span class="user-name">AI Bot</span> <span class="handle">@ai_bot</span></a>
    </div>
    <div data-testid="tweetText" class="tweet-text">
      Crypto is the future! Buy now! 🚀 To celebrate, I am giving away 5 ETH to everyone who Retweets and Follows! #crypto #giveaway #eth
    </div>
    <a href="/status/456" style="display:none">time</a>
  </article>

  <!-- Promoted Tweet (Ad) -->
  <article data-testid="tweet" class="tweet" id="promoted-tweet">
    <div data-testid="User-Name">
      <a href="/advertiser" role="link"><span class="user-name">Brand X</span> <span class="handle">@BrandX</span></a>
      <!-- Typical structure for "Ad" label -->
      <div dir="ltr" class="css-901oao r-1bwzh9t r-1q142lx r-37j5jr r-a023e6 r-16dba41 r-rjixqe r-bcqeeo r-qvutc0">
        <span class="css-901oao css-16my406 r-poiln3 r-bcqeeo r-qvutc0">Ad</span>
      </div>
    </div>
    <div data-testid="tweetText" class="tweet-text">
      Buy our amazing product! It's the best! #ad
    </div>
    <a href="/status/789" style="display:none">time</a>
  </article>

  <script src="simulate_extension.js"></script>
</body>
</html>
